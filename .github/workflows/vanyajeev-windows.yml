name: Vanyajeev Windows build

on:
  push:
    branches: [master]
    paths: ['vanyajeev/**', 'tools/photo_develop.py', 'tools/expert_finish.py', 'tools/upscale_print.py',
            'tools/calib.json', '.github/workflows/vanyajeev-windows.yml']
    tags: ['vanyajeev-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vanyajeev
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/vanyajeev-v* ]]; then V="${GITHUB_REF#refs/tags/vanyajeev-v}"; else V="1.0.0"; fi
          echo "VANYAJEEV_VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test (source)
        env: { QT_QPA_PLATFORM: offscreen }
        run: python main.py --selftest

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/vanyajeev.spec

      - name: Self-test (packaged exe)
        shell: pwsh
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          $p = Start-Process -FilePath dist\Vanyajeev\Vanyajeev.exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow `
               -RedirectStandardOutput selftest.txt -RedirectStandardError selftest_err.txt
          Get-Content selftest.txt, selftest_err.txt
          if ($p.ExitCode -ne 0) { throw "packaged self-test failed ($($p.ExitCode))" }
          if (-not (Select-String -Path selftest.txt -Pattern 'SELFTEST OK')) { throw 'no SELFTEST OK' }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1 }
            $env:PATH = "$($iscc.DirectoryName);$env:PATH"
          }
          iscc packaging\installer.iss

      - name: MSIX package (Microsoft Store)
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: python packaging/build_msix.py

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\Vanyajeev\* -DestinationPath "dist\Vanyajeev-$env:VANYAJEEV_VERSION-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Vanyajeev-${{ env.VANYAJEEV_VERSION }}-windows
          path: |
            vanyajeev/dist/VanyajeevSetup-*.exe
            vanyajeev/dist/Vanyajeev-*.msix
            vanyajeev/dist/Vanyajeev-*-portable.zip

      - name: GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/vanyajeev-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vanyajeev ${{ env.VANYAJEEV_VERSION }}
          files: |
            vanyajeev/dist/VanyajeevSetup-*.exe
            vanyajeev/dist/Vanyajeev-*.msix
            vanyajeev/dist/Vanyajeev-*-portable.zip
